name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.mod

      - name: Lint and format check
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: apps/api

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build ./...

      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

      - name: Generated queries are fresh
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD":/src -w /src \
            sqlc/sqlc:1.31.1@sha256:70f53171d27b2424e9358869975455a6e955a5aa8e58a998a270a6e34e525537 generate
          if [ -n "$(git status --porcelain -- internal/adapter/postgres/sqlcgen)" ]; then
            git status --short -- internal/adapter/postgres/sqlcgen
            echo "::error::sqlc output is stale. Run 'pnpm gen' and commit the result."
            exit 1
          fi

  integration:
    name: Integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:19-alpine
        env:
          POSTGRES_USER: horizon
          POSTGRES_PASSWORD: horizon
          POSTGRES_DB: horizon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U horizon -d horizon"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Throwaway test databases are created through this admin connection (test-only credentials).
      TEST_DATABASE_URL: postgres://horizon:horizon@localhost:5432/postgres?sslmode=disable
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.mod

      - name: Integration tests (real Postgres)
        run: go test -race -count=1 -shuffle=on -tags=integration ./...

  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Tooling tests (docs script and agent hooks)
        run: node --test "scripts/*.test.mjs" ".claude/hooks/*.test.mjs"

      - name: Indexes, third-party notices and line limits
        run: node scripts/docs-index.mjs --check

  pr-title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require a Conventional Commit title
        env:
          # Passed through the environment, never interpolated into the script (injection-safe).
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: [^ ].+'
          if printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "PR title is a Conventional Commit."
          else
            echo "::error::PR title must be a Conventional Commit, e.g. 'feat(api): add tags'. Squash merges use it as the commit message."
            exit 1
          fi
