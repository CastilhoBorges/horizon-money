# sqlc generates typed Go from db/queries against the schema in db/migrations.
# Run it with `pnpm gen`, which uses the pinned sqlc image (CI checks the output is fresh).
version: "2"
sql:
  - engine: postgresql
    schema: db/migrations
    queries: db/queries
    gen:
      go:
        package: sqlcgen
        out: internal/adapter/postgres/sqlcgen
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
